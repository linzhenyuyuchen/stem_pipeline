 <h2>Dataset 一览</h2><div class="table-wrap"><table><thead><tr><th>Dataset</th><th>Rows</th><th>中文</th><th>英文</th><th>混合</th><th>平均长度</th><th>Easy</th><th>Medium</th><th>Hard</th></tr></thead><tbody>${ORDER.map(name=>{const r=REPORTS[name],a=r.assistant,d=r.metadata.difficulty.counts;return `<tr class="dataset-row" data-name="${esc(name)}"><td>${esc(name)}</td><td>${nf.format(r.rows)}</td><td>${nf.format(a.language.zh||0)}</td><td>${nf.format(a.language.en||0)}</td><td>${nf.format(a.language.mixed||0)}</td><td>${nf.format(a.length.average??a.length.mean)}</td><td>${nf.format(d.easy||0)}</td><td>${nf.format(d.medium||0)}</td><td>${nf.format(d.hard||0)}</td></tr>`}).join('')}</tbody></table></div>

 bindFields(); document.querySelectorAll('.dataset-row').forEach(row=>row.onclick=()=>showDataset(row.dataset.name)); window.scrollTo(0,0);
}

function fieldDefinitions(m){ return [
 ['domain_label','Domain label',m.domain_label],['genre_label','Genre label',m.genre_label],
 ['subject_primary','Subject · primary',m.subject_labels.primary_label],['subject_secondary','Subject · secondary',m.subject_labels.secondary_label],['subject_combination','Subject · combination',m.subject_labels.combination],
 ['course','Course',m.course],['knowledge_points','Knowledge points',m.knowledge_points],['difficulty','Difficulty',m.difficulty],
 ...Object.entries(m.difficulty_factors).map(([k,v])=>['factor_'+k,'Difficulty factor · '+k,v]) ]; }
function fieldBlock(id,title,field,totalRows,options={}){ const count=field.value_count??Object.keys(field.counts||{}).length, top=options.top||100, headerAll=!!options.headerAll;
 return `<details class="field" data-field="${esc(id)}" data-scope="${esc(options.scope||'dataset')}" data-top="${top}" ${options.open?'open':''}><summary><span class="field-summary-copy"><span class="field-title">${esc(title)}</span><span class="subtle">${nf.format(count)} values · coverage ${pct(field.rows_with_value,totalRows)} · ${nf.format(field.occurrences)} occurrences${field.truncated_to?` · <b style="color:#b45309">仅收录 Top ${nf.format(field.truncated_to)}</b>`:''}</span></span>${headerAll?'<button class="small-btn summary-action">全量展示</button>':''}</summary><div class="field-body"><div class="field-tools"><input class="field-search" placeholder="搜索该字段的值…">${headerAll?'':`<button class="small-btn show-all">显示全部</button><button class="small-btn show-top">仅 Top ${top}</button>`}</div><div class="field-table"></div></div></details>`; }
function renderField(details,mode='top',query='',page=0){ const overview=details.dataset.scope==='overview', source=overview?SUMMARY:REPORTS[current], def=fieldDefinitions(source.metadata).find(x=>x[0]===details.dataset.field); if(!def)return;
 const field=def[2], q=query.trim().toLowerCase(), topLimit=Number(details.dataset.top||100), semantic=details.dataset.field==='difficulty'||details.dataset.field.startsWith('factor_'), useFastTop=overview&&!semantic&&!q&&mode!=='all'&&field.top_entries&&topLimit===10, pageSize=mode==='all'?1000:topLimit;
 let rows=[], fullCount=field.value_count??Object.keys(field.counts||{}).length, pageCount=1;
 if(semantic&&!q) rows=(details.dataset.field==='difficulty'?difficultyEntries(field.counts):factorEntries(field.counts)).slice(mode==='all'?page*pageSize:0,mode==='all'?(page+1)*pageSize:topLimit);
 else if(useFastTop) rows=field.top_entries;
 else if(overview) {
   if(q) { fullCount=0; for(const k in field.counts){if(String(k).toLowerCase().includes(q)){if(rows.length<1000)rows.push([k,field.counts[k]]);fullCount++;}} }
   else { pageCount=Math.max(1,Math.ceil(fullCount/pageSize));page=Math.max(0,Math.min(page,pageCount-1));const start=page*pageSize;let index=0;for(const k in field.counts){if(index>=start)rows.push([k,field.counts[k]]);index++;if(rows.length>=pageSize)break;} }
 } else {
   if(!details._rowsCache)details._rowsCache=Object.entries(field.counts||{}).sort((a,b)=>b[1]-a[1]||String(a[0]).localeCompare(String(b[0])));let allRows=details._rowsCache;if(q)allRows=allRows.filter(([k])=>String(k).toLowerCase().includes(q));fullCount=allRows.length;pageCount=Math.max(1,Math.ceil(fullCount/pageSize));page=Math.max(0,Math.min(page,pageCount-1));rows=allRows.slice(mode==='all'?page*pageSize:0,mode==='all'?(page+1)*pageSize:topLimit);
 }
 if(semantic&&q) rows=details.dataset.field==='difficulty'?difficultyEntries(Object.fromEntries(rows)):factorEntries(Object.fromEntries(rows));
 const total=field.count_total??Object.values(field.counts||{}).reduce((a,b)=>a+b,0), max=rows.reduce((value,item)=>Math.max(value,item[1]),1), target=details.querySelector('.field-table');
 const pager=mode==='all'&&pageCount>1?`<div class="field-tools" style="justify-content:flex-end;margin:10px 0 0"><button class="small-btn page-prev" ${page===0?'disabled':''}>上一页</button><span class="subtle">第 ${nf.format(page+1)} / ${nf.format(pageCount)} 页</span><button class="small-btn page-next" ${page+1>=pageCount?'disabled':''}>下一页</button></div>`:'';
 target.innerHTML=rows.length?`<div class="field-distribution">${rows.map(([k,v])=>`<div class="bar-row"><div class="bar-label" title="${esc(k)}">${esc(k)}</div><div class="track" title="${pct(v,total)}"><div class="fill" style="width:${100*v/max}%"></div></div><div class="bar-value">${nf.format(v)} · ${pct(v,total)}</div></div>`).join('')}</div>${pager}<div class="subtle" style="margin-top:8px">${mode==='all'?`完整分布 · 当前显示第 ${nf.format(page*pageSize+1)}–${nf.format(page*pageSize+rows.length)} 项`:`Top ${nf.format(rows.length)}`} / ${nf.format(fullCount)} 个值；进度条相对于当前页最高计数。</div>`:'<div class="empty">没有匹配值</div>';
 const prev=target.querySelector('.page-prev'), next=target.querySelector('.page-next'); if(prev)prev.onclick=()=>renderField(details,mode,query,page-1);if(next)next.onclick=()=>renderField(details,mode,query,page+1);
 details.dataset.mode=mode;
}
function bindFields(){ document.querySelectorAll('details.field').forEach(d=>{ d.addEventListener('toggle',()=>{if(d.open&&!d.dataset.loaded){renderField(d);d.dataset.loaded='1'}});
  const input=d.querySelector('.field-search'); input.oninput=()=>renderField(d,d.dataset.mode||'top',input.value);
  const all=d.querySelector('.show-all'), top=d.querySelector('.show-top'), action=d.querySelector('.summary-action');
  if(all) all.onclick=()=>renderField(d,'all',input.value); if(top) top.onclick=()=>renderField(d,'top',input.value);
  if(action) action.onclick=e=>{e.preventDefault();e.stopPropagation();d.open=true;const full=d.dataset.mode!=='all';renderField(d,full?'all':'top',input.value);action.textContent=full?`仅 Top ${d.dataset.top}`:'全量展示';d.dataset.loaded='1';};
  if(d.open&&!d.dataset.loaded){renderField(d);d.dataset.loaded='1';}
 }); }
function showDataset(name){ if(!REPORTS[name])return; activate(name); location.hash=encodeURIComponent(name); const r=REPORTS[name],a=r.assistant,l=a.length,d=r.metadata.difficulty.counts;
 app.innerHTML=`<button class="back" id="back">← 返回总览</button><div class="eyebrow">Dataset Detail</div><h1>${esc(name)}</h1>
 <div class="lede">完整报告包含所有标签值与计数。大型字段默认展示 Top 100，可搜索全量值或按需显示全部。</div>
 ${cards([['Rows',nf.format(r.rows)],['Assistant 回复',nf.format(a.rows_with_reply),`缺失 ${nf.format(a.missing_reply)}`],['平均回复长度',nf.format(l.average??l.mean),`范围 ${nf.format(l.min)}–${nf.format(l.max)}`],['总长度',nf.format(l.total),`${nf.format(l.english_words)} EN + ${nf.format(l.cjk_words)} CJK`]])}
 <div class="grid-2">${panel('语种分布',bars(a.language,r.rows,{zh:'var(--red)',en:'var(--blue)',mixed:'var(--gold)',other:'#999'}))}${panel('难度分布',bars(d,r.rows,{easy:'var(--green2)',medium:'var(--gold)',hard:'var(--red)','(missing)':'#999'},difficultyEntries(d)))}</div>
 <h2>回复长度</h2><div class="grid-2">${panel('长度区间',bars(l.buckets,l.count,{},lengthEntries(l.buckets)),'按区间起点升序 · English words + CJK units')}${panel('质量计数',bars(r.quality,r.rows),'0 表示未发现问题')}</div>
 <h2>Metadata 完整分布</h2><div class="notice">coverage 表示有值的行比例；occurrences 会计入数组字段的每个值。缺失值统一记录为 <code>(missing)</code>。</div><div class="fields" style="margin-top:14px">${fieldDefinitions(r.metadata).map(x=>fieldBlock(x[0],x[1],x[2],r.rows)).join('')}</div>
 <div class="footer">Schema v${r.schema_version} · source dataset ${esc(r.dataset)}</div>`;
 document.getElementById('back').onclick=showOverview; bindFields(); window.scrollTo(0,0);
}

document.getElementById('nav-home').onclick=showOverview;
document.getElementById('dataset-search').oninput=e=>{ const q=e.target.value.trim().toLowerCase(); document.querySelectorAll('.dataset-button').forEach(b=>b.hidden=!b.dataset.name.toLowerCase().includes(q)); };
document.getElementById('dl-json').onclick=function(){ const btn=this; if(btn.disabled)return; const label=btn.textContent; btn.disabled=true; btn.textContent='生成中…';
 setTimeout(()=>{ let url=null;
  try{ const bundle={meta:META,datasets:ORDER,summary:SUMMARY,reports:REPORTS};
   const blob=new Blob([JSON.stringify(bundle)],{type:'application/json'}); url=URL.createObjectURL(blob);
   const a=document.createElement('a'); a.href=url; a.download=`${META.outputDataset}_v${META.outputVersion}_${META.topValues?'top'+META.topValues:'full'}.json`;
   document.body.appendChild(a); a.click(); a.remove(); }
  catch(err){ alert('生成 JSON 失败：'+((err&&err.message)||err)); }
  finally{ if(url)setTimeout(()=>URL.revokeObjectURL(url),120000); btn.disabled=false; btn.textContent=label; }
 },30); };
nav(); const initial=decodeURIComponent(location.hash.slice(1)); initial&&REPORTS[initial]?showDataset(initial):showOverview();
</script>
</body>
</html>
